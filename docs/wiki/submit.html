<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Write a Post — DyonLaw Wiki</title>
<link rel="stylesheet" href="wiki.css">
</head>
<body>
<header><div class="wrap mast">
  <div class="org">Departement-Of-Dyon</div>
  <nav><a href="./">← Wiki</a><a href="../">The Code</a></nav>
</div></header>

<div class="wrap" style="padding:48px 28px 70px">
  <div class="kicker">Community</div>
  <h1>Write a <em>Post</em></h1>
  <p style="margin-top:12px;font-size:14px">Anyone may contribute. Posting opens a
  GitHub issue — a bot publishes it to the wiki within a minute and closes the
  issue with the live link. Requires a free GitHub account.</p>

  <div>
    <label>Title</label><input type="text" id="ptitle" placeholder="Post title">
    <label>Excerpt (one line, shown in the post list — optional, auto if blank)</label><input type="text" id="pexcerpt" placeholder="Short summary">
    <label>Body (Markdown — **bold**, *italic*, `code`, lists, &gt;quotes)</label>
    <textarea id="pbody" placeholder="Write your post here…"></textarea>
    <div style="margin-top:18px">
      <button class="btn" onclick="submitPost()">SUBMIT AS GITHUB ISSUE</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<footer><div class="wrap"><p>Departement-Of-Dyon · Community submissions</p></div></footer>

<script>
const ISSUE_URL='https://github.com/Departement-Of-Dyon/dyon-law/issues/new';
function submitPost(){
  const title=document.getElementById('ptitle').value.trim();
  let body=document.getElementById('pbody').value.trim();
  const excerpt=document.getElementById('pexcerpt').value.trim();
  if(!title||!body){
    const m=document.getElementById('msg');m.textContent='title and body are required';m.className='msg err';return;
  }
  if(excerpt)body='> '+excerpt+'\n\n'+body;
  const url=ISSUE_URL+'?'+new URLSearchParams({
    title:title, body:body, labels:'wiki-post'
  }).toString();
  window.open(url,'_blank');
  const m=document.getElementById('msg');
  m.textContent='Opened the issue form in a new tab — submit it there and the wiki publishes automatically.';
  m.className='msg ok';
}
</script>
</body></html>
